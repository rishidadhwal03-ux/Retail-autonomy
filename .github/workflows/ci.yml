name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/policy-service/requirements-dev.txt
      - name: Run policy service tests
        working-directory: services/policy-service
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build policy-service image
        run: docker build -t policy-service ./services/policy-service
      - name: Build billing-service image
        run: docker build -t billing-service ./services/billing-service